<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#001400"/>

  <!-- Grid lines -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#00ff41" stroke-width="2" opacity="0.18"/>
  <line x1="40"  y1="256" x2="472" y2="256" stroke="#00ff41" stroke-width="2" opacity="0.18"/>
  <line x1="98"  y1="98"  x2="414" y2="414" stroke="#00ff41" stroke-width="2" opacity="0.10"/>
  <line x1="414" y1="98"  x2="98"  y2="414" stroke="#00ff41" stroke-width="2" opacity="0.10"/>

  <!-- Radar rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00ff41" stroke-width="5" opacity="0.35"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00ff41" stroke-width="4" opacity="0.4"/>
  <circle cx="256" cy="256" r="70"  fill="none" stroke="#00ff41" stroke-width="3" opacity="0.45"/>

  <!-- Sweep arc (trail ~90deg) -->
  <path d="M256,256 L256,46 A210,210 0 0,1 466,256 Z" fill="#00ff41" opacity="0.12"/>
  <path d="M256,256 L256,46 A210,210 0 0,1 404,107 Z" fill="#00ff41" opacity="0.08"/>

  <!-- Sweep line (pointing up = north) -->
  <line x1="256" y1="256" x2="256" y2="46" stroke="#00ff41" stroke-width="5" opacity="0.95"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#00ff41"/>

  <!-- Blip (orange, top-right quadrant) -->
  <circle cx="340" cy="158" r="10" fill="#f05a22"/>
  <circle cx="340" cy="158" r="18" fill="none" stroke="#f05a22" stroke-width="2.5" opacity="0.45"/>
</svg>
